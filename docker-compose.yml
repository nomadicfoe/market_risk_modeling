services:
  db:
    image: postgres:16
    container_name: stockexp-db
    environment:
      POSTGRES_USER: stockexp
      POSTGRES_PASSWORD: stockexp
      POSTGRES_DB: stockexp
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockexp"]
      interval: 5s
      retries: 10

volumes:
  pgdata: